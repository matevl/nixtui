[package]
name = "nixtui"
version = "0.1.0"
edition = "2021"
description = "A lazygit-style TUI for `nix profile`"

[dependencies]
anyhow = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true
